<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>هدية أميرة الإبداع</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:linear-gradient(140deg,#fff0f8,#eee6ff,#fdfaff);font-family:Tahoma,Arial,sans-serif;color:#713b78;text-align:center;padding:20px}.card{width:min(100%,480px);padding:28px 18px;background:#ffffffdb;border:2px solid #e5b9e5;border-radius:25px;box-shadow:0 12px 40px #9e69a52a}h1{font-size:25px}.gift{display:block;margin:30px auto 16px;width:220px;height:210px;border:0;background:transparent;position:relative;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.base{position:absolute;bottom:12px;left:25px;width:170px;height:105px;background:#e987b7;border-radius:10px;box-shadow:inset -15px 0 #d36da8}.stripe{position:absolute;bottom:12px;left:95px;width:30px;height:105px;background:#aa6cbe}.lid{position:absolute;bottom:109px;left:15px;width:190px;height:36px;border-radius:8px;background:#f5acd3;z-index:2;transform-origin:30px 25px;transition:transform .8s ease}.lid:after{content:"";position:absolute;left:80px;top:0;width:30px;height:36px;background:#aa6cbe}.bow{position:absolute;left:63px;bottom:140px;font-size:70px;z-index:3;transition:transform .8s ease}.gift.open .lid{transform:translate(-40px,-65px) rotate(-23deg)}.gift.open .bow{transform:translate(-40px,-65px) rotate(-23deg)}.surprise[hidden]{display:none}.surprise{animation:show .5s ease both}.crown{font-size:72px}h2{color:#8d4aab}p{line-height:1.9}button.reset{border:0;border-radius:18px;padding:13px 22px;background:#a467b8;color:#fff;font-size:16px;cursor:pointer}@keyframes show{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}.piece{position:fixed;top:-40px;pointer-events:none;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(600deg);opacity:0}}@media(prefers-reduced-motion:reduce){.lid,.bow{transition:none}.piece{display:none}}</style></head><body><main class="card"><h1>🎀 هدية أميرة الإبداع 🎀</h1><p>مبادرة دقيقة إبداع</p><button class="gift" id="gift" type="button" aria-label="اضغطي لفتح صندوق الهدية"><span class="base"></span><span class="stripe"></span><span class="lid"></span><span class="bow">🎀</span></button><p id="hint">🎁 اضغطي على الصندوق لفتح المفاجأة!</p><section id="surprise" class="surprise" hidden><div class="crown">👑</div><div style="font-size:32px">🌟🏆🌟</div><h2>مبارك لكِ يا أميرة الإبداع!</h2><p>أحسنتِ يا مبدعة! إجابتكِ الصحيحة دليل على ذكائكِ وتألقكِ، وتستحقين تاج التميز والإبداع 💗</p><strong>إهداء من الطالبة / نورة المبرد</strong><p>إشراف المعلمة / بدرية الشنفري</p><button type="button" class="reset" id="reset">🎁 إعادة فتح الهدية</button></section></main><script>const gift=document.getElementById('gift'),surprise=document.getElementById('surprise'),hint=document.getElementById('hint');let opened=false;gift.addEventListener('click',()=>{if(opened)return;opened=true;gift.classList.add('open');hint.hidden=true;setTimeout(()=>{surprise.hidden=false;for(let i=0;i<45;i++){const e=document.createElement('span');e.className='piece';e.textContent=['⭐','✨','💗','🎉'][Math.floor(Math.random()*4)];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),4200)}},700)});document.getElementById('reset').addEventListener('click',()=>{opened=false;gift.classList.remove('open');surprise.hidden=true;hint.hidden=false;gift.focus()});</script></body></html>
